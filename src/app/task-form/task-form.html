<h2>Add New Task</h2>
<form [formGroup]="taskForm" (ngSubmit)="submit()">
    <label>Title: <input formControlName="title"></label><br>
    <label> Description: <textarea formControlName="description"></textarea></label><br>
    <label> Priority: 
        <select formControlName="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
    </label><br>
    <label>Due Date: <input type="date" formControlName="dueDate"></label><br>
    <button type="submit">Add Task</button>
</form>
<a [routerLink]="['/tasks']">Cancel</a>
