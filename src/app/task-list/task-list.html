<h2>Tasks:</h2>
<a class="addTask" [routerLink]="['/add-task']">Add New Task</a>
<ul>
    <li *ngFor="let task of tasks$ | async">
        <div class="task-actions">
            <a [routerLink]="['/tasks', task.id]">{{task.title}}</a>
            <span>Due: {{task.dueDate}}</span>
            <span>{{task.completed ? '✔' : ''}}</span>
         
            <button class="toggle" (click)="toggleTask(task.id)">Toggle Complete</button>
            <button class="delete" (click)="deleteTask(task.id)">Delete</button>
        </div>
    </li>
</ul>
